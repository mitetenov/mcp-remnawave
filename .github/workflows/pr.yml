name: PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o bin/remnawave-mcp ./cmd/remnawave-mcp
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: remnawave-mcp:test
          cache-from: type=gha,scope=remnawave-mcp
          cache-to: type=gha,mode=max,scope=remnawave-mcp

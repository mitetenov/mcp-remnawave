name: Build, Release, and Docker
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Determine version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build release binaries
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            export GOOS=${platform%/*} GOARCH=${platform#*/}
            suffix=""; if [ "$GOOS" = windows ]; then suffix=.exe; fi
            CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "dist/remnawave-mcp-${GOOS}-${GOARCH}${suffix}" ./cmd/remnawave-mcp
          done
          cp README.md VERSION dist/
          cd dist && zip -r ../mcp-release.zip .
      - uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: mcp-release.zip
          generate_release_notes: true
      - uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          cache-from: type=gha,scope=remnawave-mcp
          cache-to: type=gha,mode=max,scope=remnawave-mcp
          tags: |
            mitetenov/remnawave-mcp:latest
            mitetenov/remnawave-mcp:${{ steps.version.outputs.tag }}
            mitetenov/remnawave-mcp:${{ github.sha }}

name: Build, Release, and Docker
on:
  push:
    branches: [main]
permissions:
  contents: read
env:
  GOTOOLCHAIN: local

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    timeout-minutes: 20
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules, formatting and vet
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go mod verify
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go vet ./...
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Race tests
        run: go test -race -vet=off -count=1 ./...
      - name: Production build
        run: go build ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Determine version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build release binaries
        run: |
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            export GOOS=${platform%/*} GOARCH=${platform#*/}
            suffix=""; if [ "$GOOS" = windows ]; then suffix=.exe; fi
            CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "dist/remnawave-mcp-${GOOS}-${GOARCH}${suffix}" ./cmd/remnawave-mcp
          done
          cp README.md VERSION dist/
          cd dist && zip -r ../mcp-release.zip .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-release
          path: mcp-release.zip
          retention-days: 7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate production image before publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=remnawave-mcp
          cache-to: type=gha,mode=max,scope=remnawave-mcp

  publish:
    timeout-minutes: 20
    needs: build-and-release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine version
        id: version
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-release
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: mcp-release.zip
          generate_release_notes: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=remnawave-mcp
          cache-to: type=gha,mode=max,scope=remnawave-mcp
          tags: |
            mitetenov/remnawave-mcp:latest
            mitetenov/remnawave-mcp:${{ steps.version.outputs.tag }}
            mitetenov/remnawave-mcp:${{ github.sha }}
